<app-portal-page
  title="Profile"
  description="Update your business details shown to customers."
>
  @if (error()) {
    <p class="error-banner">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else if (profile(); as p) {
    <div class="grid">
      <section class="card">
        <h3>Cover photo</h3>
        <img class="cover" [src]="coverPreview()" alt="" />
        <label class="btn">
          {{ uploading() ? "Uploading…" : "Upload cover" }}
          <input type="file" accept="image/jpeg,image/png,image/webp" hidden (change)="onCoverSelected($event)" />
        </label>
      </section>

      <section class="card">
        <h3>Status</h3>
        <p>{{ formatTenantStatus(p.status) }}</p>
        @if (!canEdit()) {
          <p class="muted">Profile fields are locked unless status is Draft or Rejected.</p>
        }
      </section>

      <section class="card span-2">
        <h3>Edit profile</h3>
        <div class="field">
          <label for="businessName">Business name</label>
          <input id="businessName" [(ngModel)]="businessName" [disabled]="!canEdit()" />
        </div>
        <div class="field">
          <label for="categorySlug">Category slug</label>
          <input id="categorySlug" [(ngModel)]="categorySlug" [disabled]="!canEdit()" />
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" [(ngModel)]="phone" [disabled]="!canEdit()" />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" rows="3" [(ngModel)]="description" [disabled]="!canEdit()"></textarea>
        </div>
        <button type="button" class="btn btn-primary" [disabled]="!canEdit() || saving()" (click)="saveProfile()">
          Save profile
        </button>
      </section>

      <section class="card span-2">
        <h3>Booking settings</h3>
        <label class="check">
          <input type="checkbox" [(ngModel)]="autoConfirm" />
          Auto-confirm new bookings
        </label>
        <div class="field">
          <label for="deposit">Deposit % (0–100)</label>
          <input id="deposit" type="number" min="0" max="100" [(ngModel)]="depositPercent" />
        </div>
        <button type="button" class="btn btn-primary" [disabled]="saving()" (click)="saveSettings()">
          Save settings
        </button>
      </section>
    </div>
  }
</app-portal-page>
