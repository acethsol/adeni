<app-market-geo-sync />
<div class="shell">
  <header class="header" [class.pinned]="homeLayout() && searchPinned()">
    <a class="brand" routerLink="/">
      <adeni-brand-lockup class="mark" [height]="36" surface="light" />
    </a>

    <nav class="nav">
      <a routerLink="/discover" routerLinkActive="active">Explore</a>
      <a routerLink="/my-bookings" routerLinkActive="active">My bookings</a>
      @if (portalUrl; as businessUrl) {
        <a [href]="businessUrl">For businesses</a>
      }
    </nav>

    <div class="header-search" [class.visible]="homeLayout() && searchPinned()">
      @if (homeLayout() && searchPinned()) {
        <app-discovery-search variant="compact" />
      }
    </div>

    <div class="header-right">
      <div class="market-wrap">
        <button
          type="button"
          class="market-switch"
          [attr.aria-expanded]="marketMenuOpen()"
          (click)="toggleMarketMenu()"
        >
          <span class="pin" aria-hidden="true"></span>
          <span>{{ market.market()?.name ?? "Lagos" }}</span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
        @if (marketMenuOpen()) {
          <div class="market-menu" role="listbox">
            @for (m of markets; track m.id) {
              <button
                type="button"
                role="option"
                [class.active]="market.market()?.id === m.id"
                (click)="selectMarket(m.id)"
              >
                <span class="pin" aria-hidden="true"></span>
                {{ m.name }}
              </button>
            }
          </div>
        }
      </div>

      @if (auth0Mode) {
        @if (signedIn()) {
          <button type="button" class="ghost" (click)="logout()">Log out</button>
        } @else {
          <button type="button" class="ghost" (click)="login()">Sign in</button>
          <button type="button" class="cta" (click)="login()">Get started</button>
        }
      } @else if (devCustomerMode) {
        <span class="dev">Dev customer</span>
      }
    </div>
  </header>
  <main [class.flush]="flushLayout()">
    <router-outlet />
  </main>
  <app-public-footer />
</div>
