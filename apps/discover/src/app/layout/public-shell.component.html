<app-market-geo-sync />
<div class="shell">
  <header class="header">
    <a class="brand" routerLink="/">
      <span class="mark">A</span>
      <span>Adeni</span>
    </a>
    <div class="header-right">
      @if (market.market(); as m) {
        <span class="market-pill">{{ m.name }}</span>
      }
      <nav>
        <a routerLink="/discover" routerLinkActive="active">Discover</a>
        <a routerLink="/my-bookings" routerLinkActive="active">My bookings</a>
      </nav>
      @if (auth0Mode) {
        @if (signedIn()) {
          <button type="button" class="link" (click)="logout()">Log out</button>
        } @else {
          <button type="button" class="link" (click)="login()">Sign in</button>
        }
      } @else if (devCustomerMode) {
        <span class="dev">Dev customer</span>
      }
    </div>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
