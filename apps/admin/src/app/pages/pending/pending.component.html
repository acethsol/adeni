<app-portal-page title="Pending verifications" description="Approve or reject businesses awaiting verification.">
  @if (error()) {
    <p class="error-banner">{{ error() }}</p>
  }
  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else if (visible().length === 0) {
    <section class="card"><p class="muted">Queue is empty.</p></section>
  } @else {
    <section class="card">
      <ul class="plain">
        @for (item of visible(); track item.id) {
          <li class="list-row">
            <div>
              <strong>{{ item.name }}</strong>
              <p class="muted">{{ item.slug }} · {{ item.marketId }} · {{ item.status }}</p>
            </div>
            <div class="actions">
              <button type="button" class="btn btn-danger" [disabled]="busyId() === item.id" (click)="reject(item)">
                Reject
              </button>
              <button type="button" class="btn btn-primary" [disabled]="busyId() === item.id" (click)="approve(item)">
                Approve
              </button>
            </div>
          </li>
        }
      </ul>
    </section>
  }
</app-portal-page>
