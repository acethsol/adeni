@if (facade.business()) {
  <section class="widget-card billing-grid-section">
    <header class="widget-card__head">
      <h3>Commercial audit</h3>
      <p class="hint">Admin commercial edits, price binds, and subscription billing events.</p>
    </header>

    @if (isEmptyCatalog()) {
      <adeni-portal-empty-state
        icon="edit"
        title="No commercial audit entries"
        description="Run db/scripts/admin-commercial-audit-dev-seed.sql for dev samples, or edit commercial terms to append audit rows."
        [compact]="true"
      />
    } @else {
      <adeni-list-toolbar
        [showViewSwitcher]="false"
        [count]="filteredRows().length"
        [countTotal]="facade.commercialAudit().length"
        singularCountLabel="entry"
        pluralCountLabel="entries"
        searchPlaceholder="Action, actor, or metadata"
        [searchQuery]="searchQuery()"
        (searchQueryChange)="searchQuery.set($event)"
      />

      @if (isEmptySearch()) {
        <adeni-portal-empty-state
          icon="search"
          title="No matching audit entries"
          description="Try a different action name or actor id."
          [compact]="true"
        />
      } @else {
        <div class="adeni-list-results">
          <adeni-data-table
            [rows]="filteredRows()"
            [columns]="auditColumns"
            [trackRow]="trackAuditRow"
            [sortColumnId]="sortColumnId()"
            (sortColumnIdChange)="sortColumnId.set($event)"
            [sortDirection]="sortDirection()"
            (sortDirectionChange)="sortDirection.set($event)"
          >
            <ng-template adeniDataTableCell="when" let-row>
              <span class="adeni-data-table-text">{{ row.occurredAt | date: "medium" }}</span>
            </ng-template>
            <ng-template adeniDataTableCell="action" let-row>
              <code class="ref">{{ row.action }}</code>
              <span class="action-label">{{ formatActionLabel(row.action) }}</span>
            </ng-template>
            <ng-template adeniDataTableCell="actor" let-row>
              <span class="adeni-data-table-text">{{ row.actorId }}</span>
            </ng-template>
          </adeni-data-table>
        </div>
      }
    }
  </section>
}
