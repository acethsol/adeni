<adeni-modal
  [open]="open()"
  [title]="isCreate() ? tr('common.addMarket') : tr('common.editMarket')"
  [subtitle]="
    isCreate()
      ? tr('admin.markets.newMarketsStartOfflineUnless')
      : tr('admin.markets.updateCatalogMetadataUseTake')
  "
  size="lg"
  [hasFooter]="true"
  (closed)="onClose()"
>
  @if (form(); as f) {
    <form class="market-form" (ngSubmit)="onSubmit(); $event.preventDefault()">
      @if (isCreate()) {
        <label>
          {{ tr('admin.markets.marketId') }}
          <input
            required
            pattern="[a-z][a-z0-9-]*"
            [ngModel]="f.id"
            (ngModelChange)="patch({ id: $event })"
            name="id"
            placeholder="lagos"
            autocomplete="off"
          />
          <span class="hint">{{ tr('admin.markets.lowercaseSlugUsedUrlsLocation') }}</span>
        </label>
      } @else {
        <p class="readonly-id"><strong>{{ tr('admin.markets.id') }}</strong> {{ f.id }}</p>
      }

      <label>
        {{ tr('common.displayName') }}
        <input
          required
          [ngModel]="f.name"
          (ngModelChange)="patch({ name: $event })"
          name="name"
          placeholder="Lagos"
        />
      </label>

      <div class="grid">
        <label>
          {{ tr('admin.markets.countryIso') }}
          <input
            required
            maxlength="2"
            [ngModel]="f.countryCode"
            (ngModelChange)="patch({ countryCode: $event })"
            name="countryCode"
          />
        </label>
        <label>
          {{ tr('admin.markets.currencyIso') }}
          <input
            required
            maxlength="3"
            [ngModel]="f.currency"
            (ngModelChange)="patch({ currency: $event })"
            name="currency"
          />
        </label>
      </div>

      <label>
        {{ tr('admin.markets.timeZoneIana') }}
        <input
          required
          [ngModel]="f.timeZoneId"
          (ngModelChange)="patch({ timeZoneId: $event })"
          name="timeZoneId"
          placeholder="Africa/Lagos"
        />
      </label>

      <div class="grid">
        <label>
          {{ tr('admin.markets.defaultLatitude') }}
          <input
            type="number"
            step="0.0001"
            required
            [ngModel]="f.defaultLat"
            (ngModelChange)="patch({ defaultLat: +$event })"
            name="defaultLat"
          />
        </label>
        <label>
          {{ tr('admin.markets.defaultLongitude') }}
          <input
            type="number"
            step="0.0001"
            required
            [ngModel]="f.defaultLng"
            (ngModelChange)="patch({ defaultLng: +$event })"
            name="defaultLng"
          />
        </label>
      </div>

      <fieldset>
        <legend>{{ tr('admin.markets.languages') }}</legend>
        <label class="check">
          <input
            type="checkbox"
            [ngModel]="f.languagesEn"
            (ngModelChange)="patch({ languagesEn: $event })"
            name="languagesEn"
          />
          {{ tr('admin.markets.english') }}
        </label>
        <label class="check">
          <input
            type="checkbox"
            [ngModel]="f.languagesFr"
            (ngModelChange)="patch({ languagesFr: $event })"
            name="languagesFr"
          />
          {{ tr('admin.markets.french') }}
        </label>
      </fieldset>

      @if (isCreate()) {
        <label class="check">
          <input
            type="checkbox"
            [ngModel]="f.isLive"
            (ngModelChange)="patch({ isLive: $event })"
            name="isLive"
          />
          {{ tr('admin.markets.goLiveImmediately') }}
        </label>
      }

      <label>
        {{ tr('admin.markets.launchNoteOptional') }}
        <textarea
          rows="2"
          maxlength="500"
          [ngModel]="f.launchNote"
          (ngModelChange)="patch({ launchNote: $event })"
          name="launchNote"
        ></textarea>
      </label>

      <div modalFooter class="modal-footer">
        <adeni-staff-btn icon="close" [disabled]="saving()" (pressed)="onClose()">{{ tr('common.cancel') }}</adeni-staff-btn>
        <adeni-staff-btn type="submit" variant="primary" icon="save" [disabled]="saving()">
          {{ saving() ? tr('common.saving') : isCreate() ? tr('admin.markets.createMarket') : tr('admin.markets.saveChanges') }}
        </adeni-staff-btn>
      </div>
    </form>
  }
</adeni-modal>
