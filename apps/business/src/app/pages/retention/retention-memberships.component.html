<app-portal-page [title]="tr('businessApp.memberships.title')" [description]="tr('businessApp.memberships.description')">
  <button pageActions type="button" class="btn btn-primary" [disabled]="services().length === 0" (click)="openCreate()">
    <adeni-carbon-icon name="add" [size]="16" />
    {{ tr('businessApp.memberships.createPlan') }}
  </button>

  @if (error()) {
    <p class="error-banner">{{ error() }}</p>
  }

  <adeni-modal
    [open]="showCreate()"
    [title]="tr('businessApp.memberships.newPlan')"
    [subtitle]="tr('businessApp.memberships.creditsAreSessions')"
    size="lg"
    [hasFooter]="false"
    (closed)="showCreate.set(false)"
  >
    <div class="field">
      <label for="plan-name">{{ tr('businessApp.memberships.name') }}</label>
      <input id="plan-name" [ngModel]="createDraft().name" (ngModelChange)="patchCreate({ name: $event })" maxlength="200" />
    </div>
    <div class="field-row">
      <div class="field">
        <label for="plan-price">{{ tr('businessApp.memberships.price') }}</label>
        <input id="plan-price" type="number" min="0" [ngModel]="createDraft().price" (ngModelChange)="patchCreate({ price: $event })" />
      </div>
      <div class="field">
        <label for="plan-currency">{{ tr('businessApp.memberships.currency') }}</label>
        <select id="plan-currency" [ngModel]="createDraft().currency" (ngModelChange)="patchCreate({ currency: $event })">
          @for (code of currencies; track code) {
            <option [value]="code">{{ code }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label for="plan-interval">{{ tr('businessApp.memberships.interval') }}</label>
        <select id="plan-interval" [ngModel]="createDraft().billingInterval" (ngModelChange)="patchCreate({ billingInterval: $event })">
          @for (interval of intervals; track interval) {
            <option [value]="interval">{{ intervalLabel(interval) }}</option>
          }
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="plan-service">{{ tr('businessApp.memberships.service') }}</label>
        <select id="plan-service" [ngModel]="createDraft().serviceOfferingId" (ngModelChange)="patchCreate({ serviceOfferingId: $event })">
          @for (service of services(); track service.id) {
            <option [value]="service.id">{{ service.name }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label for="plan-qty">{{ tr('businessApp.memberships.quantity') }}</label>
        <input id="plan-qty" type="number" min="1" max="1000" [ngModel]="createDraft().quantityPerCycle" (ngModelChange)="patchCreate({ quantityPerCycle: $event })" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="plan-rollover">{{ tr('businessApp.memberships.rollover') }}</label>
        <select id="plan-rollover" [ngModel]="createDraft().rolloverPolicy" (ngModelChange)="patchCreate({ rolloverPolicy: $event })">
          <option value="none">{{ tr('businessApp.memberships.rolloverNone') }}</option>
          <option value="carry_over_one_cycle">{{ tr('businessApp.memberships.rolloverCarryOver') }}</option>
        </select>
      </div>
      <div class="field">
        <label for="plan-cancel">{{ tr('businessApp.memberships.cancellation') }}</label>
        <select id="plan-cancel" [ngModel]="createDraft().cancellationPolicy" (ngModelChange)="patchCreate({ cancellationPolicy: $event })">
          <option value="end_of_cycle">{{ tr('businessApp.memberships.cancelEndOfCycle') }}</option>
          <option value="immediate">{{ tr('businessApp.memberships.cancelImmediate') }}</option>
        </select>
      </div>
      <div class="field">
        <label for="plan-grace">{{ tr('businessApp.memberships.graceDays') }}</label>
        <input id="plan-grace" type="number" min="0" max="30" [ngModel]="createDraft().pastDueGraceDays" (ngModelChange)="patchCreate({ pastDueGraceDays: $event })" />
      </div>
    </div>
    <div class="field">
      <label class="check">
        <input type="checkbox" [ngModel]="createDraft().allowFreeze" (ngModelChange)="patchCreate({ allowFreeze: $event })" />
        {{ tr('businessApp.memberships.allowFreeze') }}
      </label>
    </div>
    <div class="actions">
      <button type="button" class="btn" (click)="showCreate.set(false)">
        <adeni-carbon-icon name="close" [size]="16" />
        {{ tr('common.cancel') }}
      </button>
      <button type="button" class="btn btn-primary" [disabled]="!canCreate() || busy()" (click)="saveCreate()">
        <adeni-carbon-icon name="save" [size]="16" />
        {{ tr('common.save') }}
      </button>
    </div>
  </adeni-modal>

  @if (plans().length === 0 && !loading()) {
    <adeni-portal-empty-state
      icon="task"
      [title]="tr('businessApp.memberships.emptyTitle')"
      [description]="tr('businessApp.memberships.emptyDescription')"
    />
  } @else {
    <div class="roster">
      <adeni-list-toolbar
        storageKey="businessApp.retention.memberships"
        [viewMode]="viewMode()"
        (viewModeChange)="viewMode.set($event)"
        [count]="filtered().length"
        [countTotal]="plans().length"
        [singularCountLabel]="tr('businessApp.memberships.plan')"
        [pluralCountLabel]="tr('businessApp.memberships.plansLabel')"
        [searchPlaceholder]="tr('businessApp.memberships.searchPlans')"
        [searchQuery]="search()"
        (searchQueryChange)="search.set($event)"
      />

      @if (filtered().length === 0) {
        <adeni-portal-empty-state icon="search" [title]="tr('common.noMatches')" [compact]="true" />
      } @else {
        <div class="adeni-list-results">
          <adeni-data-table [rows]="filtered()" [columns]="columns()" [trackRow]="trackRow">
            <ng-template adeniDataTableCell="status" let-row>
              <adeni-pill [tone]="row.isActive ? 'success' : 'neutral'" [compact]="true">
                {{ statusLabel(row) }}
              </adeni-pill>
            </ng-template>
            <ng-template adeniDataTableActions let-row>
              <adeni-row-action-bar>
                <adeni-icon-btn
                  icon="close"
                  [label]="tr('businessApp.memberships.deactivate')"
                  variant="table"
                  [dense]="true"
                  [disabled]="!row.isActive || busy()"
                  (click)="deactivate(row)"
                />
              </adeni-row-action-bar>
            </ng-template>
          </adeni-data-table>
        </div>
      }
    </div>
  }
</app-portal-page>
