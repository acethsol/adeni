services:
  redis:
    image: redis:7-alpine
    container_name: adeni-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Azure SQL Edge — works on amd64 and arm64 (Docker Desktop Apple/Windows ARM).
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: adeni-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Adeni_Dev_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - adeni_mssql_data:/var/opt/mssql
    # Azure SQL Edge image has no sqlcmd; probe the TDS port instead.
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redisinsight:
    profiles: [ui]
    image: redis/redisinsight:latest
    container_name: adeni-redisinsight
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: adeni-redis
    ports:
      - "5540:5540"
    volumes:
      - adeni_redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  adeni_mssql_data:
  adeni_redisinsight_data:
