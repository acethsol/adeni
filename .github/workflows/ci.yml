name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Integration tests use InMemory (empty AdeniDb). Redis service reserved for future real-cache tests.
      ConnectionStrings__AdeniDb: ""
      Redis__ConnectionString: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Adeni.slnx

      - name: Build
        run: dotnet build Adeni.slnx -c Release --no-restore

      - name: Build database project
        run: dotnet build db/Adeni.Database/Adeni.Database.sqlproj -c Release

      - name: Test
        env:
          ConnectionStrings__AdeniDb: ""
          Redis__ConnectionString: ""
        run: dotnet test Adeni.slnx -c Release --no-build --verbosity normal

      - name: Vulnerability scan
        run: dotnet list Adeni.slnx package --vulnerable --include-transitive

  portal-angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular portal
        run: npm run build:portal

      - name: Build Angular admin
        run: npm run build:admin

      - name: Build Angular discover
        run: npm run build:discover
